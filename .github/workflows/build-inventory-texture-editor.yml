name: Build Inventory Texture Editor

on:
  push:
    branches: [main]
    paths:
      - 'InventoryTextureEditor/**'
      - '.github/workflows/build-inventory-texture-editor.yml'
  pull_request:
    paths:
      - 'InventoryTextureEditor/**'
      - '.github/workflows/build-inventory-texture-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Compile and package with Minecraft 26.3 and Fabric
        working-directory: InventoryTextureEditor
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: InventoryTextureEditor-26.3-${{ github.run_number }}
          path: InventoryTextureEditor/build/libs/inventorytextureeditor-26.3-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
